name: winner_spin
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  path_provider: ^2.1.5
  firebase_core: ^4.5.0
  firebase_app_check: ^0.4.1
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  lottie: ^3.3.1
  url_launcher: ^6.3.2
  connectivity_plus: ^6.1.5
  internet_connection_checker_plus: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.png
    - assets/avatars/
    - lib/images/auth_shared/
    - lib/images/login_screen/
    - lib/images/register_screen/
    - lib/images/slot_main_screen/
    - lib/images/slot_main_screen/Items/
    - lib/images/slot_main_screen/WIN_ARTICLES/
    - assets/audio/Items/
    - assets/animations/

  # Bundled fonts keep typography consistent on first launch and offline.
  fonts:
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
          weight: 400

    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/BarlowCondensed-Black.ttf
          weight: 900

    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800

    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Black.ttf
          weight: 900
